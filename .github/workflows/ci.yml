name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.1
        # why: pin na immutable SHA pro supply-chain bezpečnost

      - uses: actions/setup-python@65d7f2d534ac1bc67fcd62888c5f4f3d2cb76c45 # v5.1.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check
        run: python -m py_compile main.py config.py parser.py ocr_engine.py gui.py

      - name: Run tests
        run: python -m pytest tests -q

      - name: Smoke check - hardware detection
        run: python -c "import config; print(config.get_hardware_specs())"
